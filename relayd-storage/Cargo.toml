[package]
name = "relayd-storage"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
relayd-core = { path = "../relayd-core" }
serde = { version = "1.0.229", features = ["derive"] }
redb = { version = "4.4.0", optional = true }
ron = { version = "0.12.2", optional = true }
postcard = { version = "1.1.3", features = ["alloc"], optional = true }

[features]
backend = ["relayd-core/backend", "dep:redb", "dep:ron", "dep:postcard"]

[lints]
workspace = true
