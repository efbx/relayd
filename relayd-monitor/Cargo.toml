[package]
name = "relayd-monitor"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
relayd-core = { path = "../relayd-core" }
dioxus-fullstack = { version = "0.7.10", default-features = false }
serde = { version = "1.0.229", features = ["derive", "rc"] }
axum = { version = "0.8.9", optional = true }
dioxus-server = { version = "0.7.10", optional = true }
futures-util = { version = "0.3.34", optional = true }
http-body = { version = "1.1.0", optional = true }
relayd-storage = { path = "../relayd-storage" }
tokio = { version = "1.54.1", features = ["time"], optional = true }
tracing = { version = "0.1.44", optional = true }
sylk = "0.5.0"
humantime = "2.4.0"
bytesize = "2.7.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "time"] }

[features]
backend =["relayd-core/backend", "dep:axum", "dep:futures-util", "dep:http-body", "relayd-storage/backend", "dep:tokio", "dep:tracing"]
server = ["backend", "dioxus-fullstack/server", "dep:dioxus-server", "sylk/server"]
web = ["dioxus-fullstack/web"]
standalone = ["backend", "sylk/standalone"]

[lints]
workspace = true
