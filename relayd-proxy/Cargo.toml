[package]
name = "relayd-proxy"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
sylk = "0.5.0"
http-body = "1.1.0"
pin-project-lite = "0.2.17"
relayd-core = { path = "../relayd-core", features = ["backend"] }
relayd-monitor = { path = "../relayd-monitor", features = ["backend"] }
relayd-storage = { path = "../relayd-storage", features = ["backend"] }
relayd-targets = { path = "../relayd-targets", features = ["backend"] }
relayd-vpn = { path = "../relayd-vpn", features = ["backend"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "socks", "stream", "http2"] }
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
