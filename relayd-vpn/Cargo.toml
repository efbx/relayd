[package]
name = "relayd-vpn"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
dioxus-fullstack = { version = "0.7.10", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
dioxus-server = { version = "0.7.10", optional = true }
sylk = "0.5.0"
relayd-core = { path = "../relayd-core", optional = true }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1.44", optional = true }

[features]
backend = ["dep:tokio", "dep:tracing", "dep:relayd-core", "relayd-core/backend"]
server = ["backend", "dioxus-fullstack/server", "dep:dioxus-server", "sylk/server"]
web = ["dioxus-fullstack/web"]
standalone = ["backend", "sylk/standalone"]

[lints]
workspace = true
