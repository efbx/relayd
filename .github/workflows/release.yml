name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features relayd-app/server

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          - os: macos-15
            name: macos-aarch64
          - os: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - name: build
        run: dx bundle --package relayd-app --platform web --fullstack --release
      - name: package
        run: |
          mkdir -p package/relayd
          cp target/dx/relayd/release/web/server package/relayd/relayd
          cp -R target/dx/relayd/release/web/public package/relayd/public
          cp -R deploy package/relayd/deploy
          tar -C package -czf relayd-${{ matrix.name }}.tar.gz relayd
      - uses: actions/upload-artifact@v7
        with:
          name: relayd-${{ matrix.name }}
          path: relayd-${{ matrix.name }}.tar.gz

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            types: --package-types appimage
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            types: --package-types appimage
          - os: macos-15
            name: macos-aarch64
            types: --package-types macos --package-types dmg
          - os: macos-15-intel
            name: macos-x86_64
            types: --package-types macos --package-types dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - name: tools
        run: sh deploy/provision-tools.sh standalone
      - name: appimage tools
        if: runner.os == 'Linux'
        run: |
          arch="$(uname -m)"
          tools="$RUNNER_TEMP/dx/tools"
          mkdir -p "$tools"
          curl -fsSL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage" -o "$tools/linuxdeploy-$arch.AppImage"
          chmod 755 "$tools/linuxdeploy-$arch.AppImage"
          curl -fsSL "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$arch" -o "$RUNNER_TEMP/appimage-runtime"
          echo "DX_HOME=$RUNNER_TEMP/dx" >> "$GITHUB_ENV"
          echo "LDAI_RUNTIME_FILE=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: build
        run: |
          for attempt in 1 2 3; do
            if dx bundle --package relayd-app --desktop --release ${{ matrix.types }} --out-dir dist; then
              exit 0
            fi
            echo "bundle attempt $attempt failed"
            sleep 15
          done
          exit 1
      - name: check appimage
        if: runner.os == 'Linux'
        run: |
          image="$(ls "$PWD"/dist/*.AppImage)"
          if head -c 2000000 "$image" | grep -aq "libfuse.so.2"; then
            echo "the AppImage still uses the old launcher that needs libfuse2"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract >/dev/null
          ls -la squashfs-root/usr/bin
          for program in relayd cloudflared wireproxy; do
            test -x "squashfs-root/usr/bin/$program"
          done
      - name: package
        if: runner.os == 'macOS'
        run: cp dist/*.dmg relayd-desktop-${{ matrix.name }}.dmg
      - name: package
        if: runner.os == 'Linux'
        run: cp dist/*.AppImage relayd-desktop-${{ matrix.name }}.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: relayd-desktop-${{ matrix.name }}
          path: relayd-desktop-${{ matrix.name }}.*

  release:
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: relayd-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.AppImage
            deploy/install.sh
            deploy/proxmox.sh
