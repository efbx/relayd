[package]
name = "relayd-tunnel"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
dioxus-fullstack = { version = "0.7.10", default-features = false }
dioxus-server = { version = "0.7.10", optional = true }
futures-util = { version = "0.3.34", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sylk = "0.5.0"
relayd-core = { path = "../relayd-core", optional = true }
tokio ={ version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1.44", optional = true }

[features]
backend = ["dep:futures-util", "relayd-core/backend", "dep:tokio", "dep:tracing"]
server = ["backend", "dioxus-fullstack/server", "dep:dioxus-server", "sylk/server"]
web = ["dioxus-fullstack/web"]
standalone = ["backend", "sylk/standalone"]

[lints]
workspace = true
