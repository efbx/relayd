[package]
name = "relayd-ui"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
relayd-core = { path = "../relayd-core" }
relayd-monitor = { path = "../relayd-monitor" }
relayd-settings = { path = "../relayd-settings" }
relayd-targets = { path = "../relayd-targets" }
relayd-tunnel = { path = "../relayd-tunnel" }
relayd-vpn = { path = "../relayd-vpn" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dioxus-fullstack = { version = "0.7.10", default-features = false }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "hooks", "signals", "asset", "document"] }
dioxus-sdk-time = "0.7.0"
futures-util = "0.3.34"
sylk = "0.5.0"

[features]
web = [
    "dioxus-fullstack/web",
    "relayd-monitor/web",
    "relayd-settings/web",
    "relayd-targets/web",
    "relayd-tunnel/web",
    "relayd-vpn/web",
]
standalone = ["dioxus/desktop"]

[lints]
workspace = true
